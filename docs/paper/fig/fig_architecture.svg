<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
  <!-- client -->
  <rect x="10" y="20" width="110" height="46" rx="4" fill="#f3f3f3" stroke="#666"/>
  <text x="65" y="39" text-anchor="middle" font-weight="bold">Coding client</text>
  <text x="65" y="54" text-anchor="middle" font-size="9">Claude Code / Codex</text>
  <!-- server -->
  <rect x="150" y="10" width="400" height="280" rx="6" fill="none" stroke="#333" stroke-dasharray="4 3"/>
  <text x="160" y="26" font-size="9.5" fill="#333">NVMAIServer process (one binary, one process)</text>
  <rect x="165" y="38" width="120" height="44" rx="4" fill="#e8f0f8" stroke="#2f7fb3"/>
  <text x="225" y="56" text-anchor="middle" font-weight="bold">MemoryBackend</text>
  <text x="225" y="70" text-anchor="middle" font-size="9">decorator on the request path</text>
  <rect x="410" y="38" width="125" height="44" rx="4" fill="#fdf3e4" stroke="#d98f2b"/>
  <text x="472" y="56" text-anchor="middle" font-weight="bold">Inference backend</text>
  <text x="472" y="70" text-anchor="middle" font-size="9">35B MoE, experts from SSD</text>
  <rect x="165" y="108" width="120" height="40" rx="4" fill="#e8f0f8" stroke="#2f7fb3"/>
  <text x="225" y="125" text-anchor="middle" font-weight="bold">MemoryService</text>
  <text x="225" y="139" text-anchor="middle" font-size="9">one workspace per project</text>
  <rect x="165" y="172" width="120" height="40" rx="4" fill="#e8f0f8" stroke="#2f7fb3"/>
  <text x="225" y="189" text-anchor="middle" font-weight="bold">ContinuityStore</text>
  <text x="225" y="203" text-anchor="middle" font-size="9">facts · JournalStore: log</text>
  <!-- engine -->
  <rect x="310" y="108" width="225" height="108" rx="4" fill="#eef7ee" stroke="#5aa469"/>
  <text x="422" y="122" text-anchor="middle" font-weight="bold">ContinuityEngine (actor)</text>
  <text x="422" y="134" text-anchor="middle" font-size="8.5" fill="#333">versions · supersession · disputed · budget</text>
  <rect x="320" y="142" width="100" height="26" rx="3" fill="#fff" stroke="#5aa469"/><text x="370" y="159" text-anchor="middle" font-size="9.5">SessionLog</text>
  <rect x="428" y="142" width="100" height="26" rx="3" fill="#fff" stroke="#5aa469"/><text x="478" y="159" text-anchor="middle" font-size="9.5">TaskMemory</text>
  <rect x="320" y="176" width="100" height="26" rx="3" fill="#fff" stroke="#5aa469"/><text x="370" y="193" text-anchor="middle" font-size="9.5">ContextAssembler</text>
  <rect x="428" y="176" width="100" height="26" rx="3" fill="#fff" stroke="#5aa469"/><text x="478" y="193" text-anchor="middle" font-size="9.5">FileJournal</text>
  <!-- file -->
  <rect x="312" y="252" width="222" height="28" rx="3" fill="#fafafa" stroke="#666"/>
  <text x="423" y="270" text-anchor="middle" font-size="9">memory/&lt;ns&gt;/&lt;user&gt;/&lt;workspace&gt;.ndjson + .lock</text>
  <!-- arrows -->
  <line x1="120" y1="43" x2="165" y2="55" stroke="#444" marker-end="url(#ar)"/>
  <line x1="285" y1="60" x2="410" y2="60" stroke="#444" marker-end="url(#ar)"/>
  <text x="347" y="55" text-anchor="middle" font-size="8.5" fill="#333">fragment + bootstrap</text>
  <line x1="225" y1="82" x2="225" y2="108" stroke="#444" marker-end="url(#ar)"/>
  <line x1="225" y1="148" x2="225" y2="172" stroke="#444" marker-end="url(#ar)"/>
  <line x1="285" y1="192" x2="310" y2="189" stroke="#444" marker-end="url(#ar)"/>
  <line x1="478" y1="202" x2="478" y2="252" stroke="#444" marker-end="url(#ar)"/>
  <line x1="472" y1="82" x2="472" y2="108" stroke="#d98f2b" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <text x="500" y="98" font-size="8.5" fill="#8a5a10">consolidation</text>
  <text x="14" y="120" font-size="9" fill="#333">Placement: header ›</text>
  <text x="14" y="132" font-size="9" fill="#333">declared cwd ›</text>
  <text x="14" y="144" font-size="9" fill="#333">launch directory</text>
</svg>